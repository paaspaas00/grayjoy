name: Build APKs

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish as a draft (leave empty for artifacts only)
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: grayjoy-build-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-apks:
    name: Build Grayjoy debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${RELEASE_TAG}^{commit}")"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test Grayjoy Link extension
        working-directory: browser-extension
        run: npm test

      - name: Test Spotify source
        run: node --test grayjay-android/app/src/stable/assets/sources/spotify/SpotifyScript.test.mjs

      - name: Make the Gradle wrapper executable
        working-directory: grayjay-android
        run: chmod +x gradlew

      - name: Install voice native build tools
        shell: bash
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          manager="${sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${manager}"
          "${manager}" "ndk;28.1.13356709" "cmake;3.22.1"

      - name: Prepare release signing
        id: signing
        env:
          GRAYJOY_SIGNING_KEY_BASE64: ${{ secrets.GRAYJOY_SIGNING_KEY_BASE64 }}
          GRAYJOY_RELEASE_STORE_PASSWORD: ${{ secrets.GRAYJOY_RELEASE_STORE_PASSWORD }}
          GRAYJOY_RELEASE_KEY_ALIAS: ${{ secrets.GRAYJOY_RELEASE_KEY_ALIAS }}
          GRAYJOY_RELEASE_KEY_PASSWORD: ${{ secrets.GRAYJOY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          required=(
            GRAYJOY_SIGNING_KEY_BASE64
            GRAYJOY_RELEASE_STORE_PASSWORD
            GRAYJOY_RELEASE_KEY_ALIAS
            GRAYJOY_RELEASE_KEY_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable}" ]]; then
              echo "Required release-signing secret ${variable} is not configured." >&2
              exit 1
            fi
          done

          store_file="${RUNNER_TEMP}/grayjoy-release.jks"
          printf '%s' "${GRAYJOY_SIGNING_KEY_BASE64}" | base64 --decode > "${store_file}"
          chmod 600 "${store_file}"
          echo "store_file=${store_file}" >> "${GITHUB_OUTPUT}"

      - name: Build debug and signed release APKs
        working-directory: grayjay-android
        env:
          GRAYJOY_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          GRAYJOY_RELEASE_STORE_PASSWORD: ${{ secrets.GRAYJOY_RELEASE_STORE_PASSWORD }}
          GRAYJOY_RELEASE_KEY_ALIAS: ${{ secrets.GRAYJOY_RELEASE_KEY_ALIAS }}
          GRAYJOY_RELEASE_KEY_PASSWORD: ${{ secrets.GRAYJOY_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app-compose:testDebugUnitTest :grayjay-engine:testDebugUnitTest :voice-companion:testDebugUnitTest :app-compose:assembleDebug :app-compose:assembleRelease :voice-companion:assembleDebug :voice-companion:assembleRelease

      - name: Sign voice companion APKs
        env:
          GRAYJOY_RELEASE_STORE_FILE: ${{ steps.signing.outputs.store_file }}
          GRAYJOY_RELEASE_STORE_PASSWORD: ${{ secrets.GRAYJOY_RELEASE_STORE_PASSWORD }}
          GRAYJOY_RELEASE_KEY_ALIAS: ${{ secrets.GRAYJOY_RELEASE_KEY_ALIAS }}
          GRAYJOY_RELEASE_KEY_PASSWORD: ${{ secrets.GRAYJOY_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          for variant in debug release; do
            directory="grayjay-android/voice-companion/build/outputs/apk/${variant}"
            target="${directory}/voice-companion-${variant}.apk"
            input="${target}"
            if [[ ! -f "${input}" ]]; then
              input="${directory}/voice-companion-${variant}-unsigned.apk"
            fi
            test -f "${input}"
            temporary="${directory}/voice-companion-${variant}-signed.apk"
            "${apksigner}" sign \
              --ks "${GRAYJOY_RELEASE_STORE_FILE}" \
              --ks-key-alias "${GRAYJOY_RELEASE_KEY_ALIAS}" \
              --ks-pass env:GRAYJOY_RELEASE_STORE_PASSWORD \
              --key-pass env:GRAYJOY_RELEASE_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "${temporary}" "${input}"
            mv "${temporary}" "${target}"
          done

      - name: Verify APK signatures and signing identity
        shell: bash
        run: |
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "${apksigner}" ]]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi
          shopt -s nullglob
          debug_apks=(grayjay-android/app-compose/build/outputs/apk/debug/app-compose-*-debug.apk)
          release_apks=(grayjay-android/app-compose/build/outputs/apk/release/app-compose-*-release.apk)
          if [[ ${#debug_apks[@]} -ne 5 ]]; then
            echo "Expected 5 signed debug APKs, found ${#debug_apks[@]}." >&2
            printf 'Found: %s\n' "${debug_apks[@]}" >&2
            exit 1
          fi
          if [[ ${#release_apks[@]} -ne 5 ]]; then
            echo "Expected 5 signed release APKs, found ${#release_apks[@]}." >&2
            printf 'Found: %s\n' "${release_apks[@]}" >&2
            exit 1
          fi

          # Public certificate fingerprint from the compatible published Grayjoy APKs.
          expected_digest="94750902f6664c15614910b0bb3c6ddb4bec351185b912d2810fd432a7d428d4"
          voice_debug="grayjay-android/voice-companion/build/outputs/apk/debug/voice-companion-debug.apk"
          voice_release="grayjay-android/voice-companion/build/outputs/apk/release/voice-companion-release.apk"
          if [[ ! -f "${voice_debug}" || ! -f "${voice_release}" ]]; then
            echo "Missing signed voice companion APKs." >&2
            exit 1
          fi
          for apk in "${debug_apks[@]}" "${release_apks[@]}" "${voice_debug}" "${voice_release}"; do
            certificate_output="$("${apksigner}" verify --verbose --print-certs "${apk}" 2>&1)"
            digest="$(awk -F ': ' '/certificate SHA-256 digest:/ { print $NF; exit }' <<<"${certificate_output}" | tr -d '\r')"
            if [[ -z "${digest}" ]]; then
              echo "Could not determine the signing certificate for ${apk}." >&2
              printf '%s\n' "${certificate_output}" >&2
              exit 1
            fi
            if [[ -z "${expected_digest}" ]]; then
              expected_digest="${digest}"
            elif [[ "${digest}" != "${expected_digest}" ]]; then
              echo "Signing certificate mismatch for ${apk}." >&2
              echo "Expected ${expected_digest}, found ${digest}." >&2
              exit 1
            fi
          done
          echo "All debug and release APKs use certificate ${expected_digest}."

      - name: Verify public APK identities and version metadata
        shell: bash
        run: |
          aapt="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${aapt}"
          expected_version="${RELEASE_TAG#v}"
          expected_code=""
          for module in app-compose voice-companion; do
            if [[ "${module}" == "app-compose" ]]; then
              package="com.futo.platformplayer.compose"
              label="Grayjoy"
            else
              package="com.futo.platformplayer.voice"
              label="Grayjoy Voice"
            fi
            for variant in debug release; do
              for apk in grayjay-android/${module}/build/outputs/apk/${variant}/*.apk; do
                [[ "${apk}" == *-unsigned.apk ]] && continue
                metadata="$("${aapt}" dump badging "${apk}")"
                header="$(head -n 1 <<<"${metadata}")"
                [[ "${header}" == *"name='${package}'"* ]] || exit 1
                if [[ -n "${expected_version}" ]]; then
                  [[ "${header}" == *"versionName='${expected_version}'"* ]] || exit 1
                fi
                code="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<<"${header}")"
                test -n "${code}"
                if [[ -z "${expected_code}" ]]; then expected_code="${code}"; fi
                [[ "${code}" == "${expected_code}" ]] || exit 1
                grep -Fqx "application-label:'${label}'" <<<"${metadata}"
                if [[ "${variant}" == "release" ]]; then
                  ! grep -q '^application-debuggable' <<<"${metadata}"
                fi
              done
            done
          done

      - name: Prepare APKs and checksums
        id: package
        shell: bash
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            version="${RELEASE_TAG}"
          else
            version="manual-${GITHUB_RUN_NUMBER}"
          fi

          variants=(arm64-v8a armeabi-v7a x86 x86_64 universal)
          mkdir -p release
          for variant in "${variants[@]}"; do
            debug_source="grayjay-android/app-compose/build/outputs/apk/debug/app-compose-${variant}-debug.apk"
            release_source="grayjay-android/app-compose/build/outputs/apk/release/app-compose-${variant}-release.apk"
            debug_target="release/Grayjoy-${version}-${variant}-debug.apk"
            release_target="release/Grayjoy-${version}-${variant}-release.apk"

            if [[ ! -f "${debug_source}" || ! -f "${release_source}" ]]; then
              echo "Missing APK output for ${variant}." >&2
              exit 1
            fi
            cp "${debug_source}" "${debug_target}"
            cp "${release_source}" "${release_target}"
          done

          cp grayjay-android/voice-companion/build/outputs/apk/debug/voice-companion-debug.apk "release/GrayjoyVoice-${version}-universal-debug.apk"
          cp grayjay-android/voice-companion/build/outputs/apk/release/voice-companion-release.apk "release/GrayjoyVoice-${version}-universal-release.apk"

          extension_target="release/Grayjoy-Link-${version}.zip"
          (
            cd browser-extension
            zip -q "../${extension_target}" \
              manifest.json \
              background.js \
              content.js \
              discovery.js \
              popup.css \
              popup.html \
              popup.js \
              protocol.js \
              README.md \
              vendor/qrcode.js \
              vendor/qrcode-generator-LICENSE.txt \
              icons/*.png
          )

          checksum_path="release/Grayjoy-${version}-SHA256SUMS.txt"
          (
            cd release
            sha256sum Grayjoy-*.apk GrayjoyVoice-*.apk Grayjoy-Link-*.zip > "$(basename "${checksum_path}")"
          )

          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        # Release assets are published by the next step. Do not block a tagged release when the
        # separate, short-lived Actions artifact quota is temporarily full.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Grayjoy-APKs-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            variants=(arm64-v8a armeabi-v7a x86 x86_64 universal)
            assets=()
            for variant in "${variants[@]}"; do
              assets+=("release/Grayjoy-${RELEASE_TAG}-${variant}-debug.apk#Grayjoy ${RELEASE_TAG} ${variant} debug APK")
              assets+=("release/Grayjoy-${RELEASE_TAG}-${variant}-release.apk#Grayjoy ${RELEASE_TAG} ${variant} signed release APK")
            done
            assets+=("release/Grayjoy-Link-${RELEASE_TAG}.zip#Grayjoy Link ${RELEASE_TAG} Chromium extension")
            assets+=("release/GrayjoyVoice-${RELEASE_TAG}-universal-debug.apk#Grayjoy Voice ${RELEASE_TAG} ARM64 and x86-64 debug APK")
            assets+=("release/GrayjoyVoice-${RELEASE_TAG}-universal-release.apk#Grayjoy Voice ${RELEASE_TAG} ARM64 and x86-64 signed release APK")
            assets+=("${CHECKSUM_PATH}#SHA-256 checksums")

            notes=".github/release-notes/${RELEASE_TAG}.it.md"
            if [[ ! -s "${notes}" ]]; then
              echo "Missing Italian release notes: ${notes}" >&2
              exit 1
            fi

            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "Grayjoy ${RELEASE_TAG}" \
              --notes-file "${notes}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
