stages:
  - deploy

variables:
  PLUGIN_NAME: FOSDEM
  ICON_FILE: FOSDEMIcon.png
  SCRIPT_FILE: FOSDEMScript.js
  CONFIG_FILE: FOSDEMConfig.json

deploy-master:
  stage: deploy
  variables:
    PRE_RELEASE: "false"
  script:
    - sh deploy.sh
  only:
    - master

deploy-dev:
  stage: deploy
  variables:
    PRE_RELEASE: "true"
  script:
    - sh deploy.sh
  only:
    - dev
