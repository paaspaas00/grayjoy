stages:
  - deploy

variables:
  PLUGIN_NAME: NASA-Plus
  ICON_FILE: NASA-PlusIcon.png
  SCRIPT_FILE: NASA-PlusScript.js
  CONFIG_FILE: NASA-PlusConfig.json

deploy-master:
  stage: deploy
  variables:
    PRE_RELEASE: "false"
  script:
    - sh deploy.sh
  only:
    - master

deploy-dev:
  stage: deploy
  variables:
    PRE_RELEASE: "true"
  script:
    - sh deploy.sh
  only:
    - dev
