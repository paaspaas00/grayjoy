plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseStoreFile = providers.gradleProperty('GRAYJOY_RELEASE_STORE_FILE')
    .orElse(providers.environmentVariable('GRAYJOY_RELEASE_STORE_FILE'))
    .getOrNull()
def releaseStorePassword = providers.gradleProperty('GRAYJOY_RELEASE_STORE_PASSWORD')
    .orElse(providers.environmentVariable('GRAYJOY_RELEASE_STORE_PASSWORD'))
    .getOrNull()
def releaseKeyAlias = providers.gradleProperty('GRAYJOY_RELEASE_KEY_ALIAS')
    .orElse(providers.environmentVariable('GRAYJOY_RELEASE_KEY_ALIAS'))
    .getOrNull()
def releaseKeyPassword = providers.gradleProperty('GRAYJOY_RELEASE_KEY_PASSWORD')
    .orElse(providers.environmentVariable('GRAYJOY_RELEASE_KEY_PASSWORD'))
    .getOrNull()
def hasReleaseSigning = [
    releaseStoreFile,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && !value.trim().isEmpty() }
def debugApplicationIdSuffix = providers
    .gradleProperty('GRAYJOY_DEBUG_APPLICATION_ID_SUFFIX')
    .getOrNull()

android {
    namespace 'com.futo.platformplayer.compose'

    bundle {
        language {
            // The in-app language picker must work without on-demand language downloads.
            enableSplit = false
        }
    }
    compileSdk 36

    defaultConfig {
        applicationId 'com.futo.platformplayer.compose'
        minSdk 28
        targetSdk 36
        versionCode 1601
        versionName '1.6.1'
        manifestPlaceholders = [grayjoyAppLabel: '@string/app_name']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (debugApplicationIdSuffix != null && !debugApplicationIdSuffix.trim().isEmpty()) {
                applicationIdSuffix debugApplicationIdSuffix
                manifestPlaceholders.grayjoyAppLabel = 'grayTEST'
            }
            // GitHub Actions is ephemeral, so its default ~/.android/debug.keystore changes on
            // every run and makes one tagged debug APK unable to update another. CI already
            // supplies the persistent Grayjoy signing identity; use it for published debug APKs
            // as well. Local builds without release credentials keep the normal local debug key.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk true
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    sourceSets {
        main {
            // Consume the source registry and any locally available plugin payloads
            // from the upstream Grayjay module without depending on its legacy UI.
            assets.srcDirs += [
                '../app/src/stable/res/raw',
                '../app/src/stable/assets',
            ]
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    def composeBom = platform('androidx.compose:compose-bom:2026.05.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.media3:media3-exoplayer:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-dash:1.9.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.9.0'
    implementation 'androidx.media3:media3-session:1.9.0'
    implementation 'androidx.media3:media3-transformer:1.9.0'
    implementation 'androidx.media3:media3-ui:1.9.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation files('../app/aar/sender-sdk-minimal-0.4.1.aar')
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation project(':grayjay-engine')
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
